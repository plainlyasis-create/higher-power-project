<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Higher Powers & Ultimate Reality</title>
  <link rel="stylesheet" href="style.css"/>
</head>

<body>

  <header>
    <h1>Higher Powers & Ultimate Reality</h1>
    <p>
      Exploring how different traditions understand what is ultimate, guiding, or foundational to meaning and practice.
    </p>
  </header>

  <main class="container">

    <!-- LEFT SIDE: CARDS -->
    <section class="grid" id="grid">

      <button class="card" onclick="showTradition('buddhism')">Buddhism</button>
      <button class="card" onclick="showTradition('hinduism')">Hinduism</button>
      <button class="card" onclick="showTradition('islam')">Islam</button>
      <button class="card" onclick="showTradition('judaism')">Judaism</button>
      <button class="card" onclick="showTradition('christianity')">Christianity</button>
      <button class="card" onclick="showTradition('confucianism')">Confucianism</button>
      <button class="card" onclick="showTradition('sikhism')">Sikhism</button>
      <button class="card" onclick="showTradition('taoism')">Taoism</button>

    </section>

    <!-- RIGHT SIDE: DISPLAY PANEL -->
    <section class="panel" id="panel">

      <h2>Click a tradition to begin</h2>
      <p>Its understanding of ultimate reality will appear here.</p>

    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
